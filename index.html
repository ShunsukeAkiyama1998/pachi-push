function tagLabel(t){

}

// 五十音の行分け。読み(yomi)の先頭1文字だけを見て判定する
const KANA_ROWS = [
  { label: "あ", chars: "あいうえお" },
  { label: "か", chars: "かきくけこがぎぐげご" },
  { label: "さ", chars: "さしすせそざじずぜぞ" },
  { label: "た", chars: "たちつてとだぢづでどっ" },
  { label: "な", chars: "なにぬねの" },
  { label: "は", chars: "はひふへほばびぶべぼぱぴぷぺぽ" },
  { label: "ま", chars: "まみむめも" },
  { label: "や", chars: "やゆよゃゅょ" },
  { label: "ら", chars: "らりるれろ" },
  { label: "わ", chars: "わをんゐゑ" }
];
function kanaRowLabel(yomi){
  if(!yomi) return "他";
  const c = yomi[0];
  const row = KANA_ROWS.find(r => r.chars.includes(c));
  return row ? row.label : "他";
}

      <div class="label">押すタイミング</div>
      <div class="timing">${it.timing}</div>
      <div class="label">わかること</div>
      <div class="info">${it.info}</div>
    </div>
  `).join("");
  const sourcesHtml = m.sources ? `<div class="sources">出典: ${m.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${s[0]}</a>`).join("")}</div>` : "";
  card.innerHTML = `
    <div class="card-head">
      <div class="card-title">
        <div class="name">${m.tags.map(tagLabel).join("")}${m.name}</div>
        <div class="meta">${m.release ? m.release + " ・ " : ""}${m.items.length}件の裏ボタン情報</div>
      </div>
      <div class="head-actions">
        <button class="share-btn" type="button" data-slug="${m.slug}">🔗 リンク</button>
        <div class="chevron">▼</div>
      </div>
    </div>
    <div class="card-body">
      ${itemsHtml}
      ${sourcesHtml}
    </div>
  `;
  card.querySelector(".card-head").addEventListener("click", (e)=>{
    if(e.target.closest(".share-btn")) return;
    card.classList.toggle("open");
  });
  card.querySelector(".share-btn").addEventListener("click", (e)=>{
    e.stopPropagation();
    const url = location.origin + location.pathname + "#" + m.slug;
    const btn = e.currentTarget;
    const done = ()=>{
      btn.textContent = "✓ コピー済み";
      btn.classList.add("copied");
      setTimeout(()=>{ btn.textContent = "🔗 リンク"; btn.classList.remove("copied"); }, 1800);
    };
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(url).then(done).catch(()=>{ prompt("このURLをコピーしてください", url); });
    } else {
      prompt("このURLをコピーしてください", url);
    }
  });
  return card;
}

function getFiltered(){
  return machines.filter(m => activeFilter === "all" || m.tags.includes(activeFilter));
}

function render(){
  const q = searchEl.value.trim().toLowerCase();
  const byFilter = getFiltered();

  if(q){
    // 検索中は五十音インデックスを隠してフラットな一覧を出す
    indexEl.style.display = "none";
    listEl.style.display = "flex";
    const filtered = byFilter.filter(m => m.name.toLowerCase().includes(q));
    listEl.innerHTML = "";
    countEl.textContent = filtered.length + "機種がヒット（全" + machines.length + "機種）";
    emptyEl.style.display = filtered.length ? "none" : "block";
    filtered.forEach(m => listEl.appendChild(buildCard(m)));
    return;
  }

  // 通常時：五十音（行）ごとにグループ化して表示
  listEl.style.display = "none";
  indexEl.style.display = "flex";
  listEl.innerHTML = "";
  emptyEl.style.display = byFilter.length ? "none" : "block";
  countEl.textContent = byFilter.length + "機種を表示中（全" + machines.length + "機種）・行をタップすると開きます";

  const grouped = {};
  byFilter.forEach(m=>{
    const label = kanaRowLabel(m.yomi);
    (grouped[label] = grouped[label] || []).push(m);
  });

  indexEl.innerHTML = "";
  const rowOrder = KANA_ROWS.map(r=>r.label).concat(["他"]);
  rowOrder.forEach(label=>{
    const group = grouped[label];
    if(!group || !group.length) return; // 該当機種が無い行は表示しない
    group.sort((a,b)=> (a.yomi||"").localeCompare(b.yomi||"", "ja"));

    const rowEl = document.createElement("div");
    rowEl.className = "kana-row";
    rowEl.dataset.row = label;
    if(openRows.has(label)) rowEl.classList.add("open");
    rowEl.innerHTML = `
      <div class="kana-row-head">
        <div class="left"><span class="kana-label">${label}行</span><span class="kana-count">（${group.length}機種）</span></div>
        <div class="chevron">▼</div>
      </div>
      <div class="kana-row-body"></div>
    `;
    const body = rowEl.querySelector(".kana-row-body");
    group.forEach(m => body.appendChild(buildCard(m)));
    rowEl.querySelector(".kana-row-head").addEventListener("click", ()=>{
      rowEl.classList.toggle("open");
      if(rowEl.classList.contains("open")) openRows.add(label); else openRows.delete(label);
    });
    indexEl.appendChild(rowEl);
  });
}

// URLの#機種スラッグを見て、該当する行を開き、カードを自動で開いてスクロールする
function openFromHash(){
  const slug = location.hash.replace("#", "");
  if(!slug) return;
  const m = machines.find(mm => mm.slug === slug);
  if(!m) return;
  // フィルターや検索で隠れていると見つからないので、一旦全表示に戻す
  activeFilter = "all";
  searchEl.value = "";
  filterBtns.forEach(b=>b.classList.toggle("active", b.dataset.filter === "all"));
  openRows.add(kanaRowLabel(m.yomi));
  render();
  const target = document.getElementById(slug);
  if(target){
    target.classList.add("open", "highlight");
    target.scrollIntoView({behavior:"smooth", block:"start"});
    setTimeout(()=>target.classList.remove("highlight"), 1700);
  }
}

searchEl.addEventListener("input", render);
filterBtns.forEach(btn=>{
  btn.addEventListener("click", ()=>{
    filterBtns.forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.filter;
    render();
  });
});
window.addEventListener("hashchange", openFromHash);

render();
openFromHash();
</script>

</body>
